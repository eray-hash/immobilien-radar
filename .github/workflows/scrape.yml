name: Scrape Kleinanzeigen

on:
  schedule:
    # 06:30 UTC = ca. 07:30/08:30 in Deutschland (je nach Sommer-/Winterzeit)
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-kleinanzeigen
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scraper.run

      - name: Commit results
        if: always()
        run: |
          git config user.name "kleinanzeigen-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/listings.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update Immobilien-Treffer"
          git push
