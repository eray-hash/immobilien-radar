<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immobilien-Radar — Mehrfamilienhäuser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <div>
      <h1>Immobilien-Radar</h1>
      <p class="subtitle">Immobilien-Inserate von Kleinanzeigen — automatisch aktualisiert</p>
    </div>
  </div>
  <p class="meta" id="meta"></p>
  <p class="markt-trend" id="marktTrend" hidden></p>
</header>

<section class="search-row">
  <input type="text" id="search" placeholder="Suche in Titel, Ort, Beschreibung…">
  <button type="button" id="filtersToggle" class="filters-toggle" aria-expanded="false" aria-controls="filtersPanel">
    Filter <span id="filterCount" class="filter-count" hidden>0</span>
  </button>
</section>

<section class="location-row">
  <input type="text" id="filterOrt" placeholder="Standort: PLZ oder Ort…">
  <div class="range-group radius-group inactive" id="radiusGroup">
    <span class="range-label">Umkreis</span>
    <input type="range" id="radiusKm" min="5" max="300" step="5" value="50" disabled>
    <span id="radiusKmLabel">50 km</span>
  </div>
</section>
<p class="radius-hint" id="radiusHint" hidden></p>

<div id="filtersPanel" class="filters-panel collapsed">
  <section class="controls">
    <select id="sortField">
      <option value="lukrativitaet_desc">Lukrativität absteigend</option>
      <option value="preis_pro_m2_asc">€/m² aufsteigend</option>
      <option value="preis_pro_m2_desc">€/m² absteigend</option>
      <option value="preis_asc">Preis aufsteigend</option>
      <option value="preis_desc">Preis absteigend</option>
      <option value="neu">Zuletzt gesehen</option>
    </select>
    <details class="multi" id="filterLukrativitaet" data-label="Lukrativität"></details>
    <details class="multi" id="filterEinschaetzung" data-label="Preiseinschätzung"></details>
    <details class="multi" id="filterObjektTyp" data-label="Objekttyp"></details>
    <details class="multi" id="filterBundesland" data-label="Bundesland"></details>
    <details class="multi" id="filterAnbieter" data-label="Anbieter"></details>
    <label class="checkbox"><input type="checkbox" id="hideGone"> Entfernte Inserate ausblenden</label>
  </section>

  <section class="controls controls-range">
    <div class="range-group">
      <span class="range-label">Preis</span>
      <input type="number" id="preisMin" placeholder="von €" min="0">
      <span class="range-sep">–</span>
      <input type="number" id="preisMax" placeholder="bis €" min="0">
    </div>
    <div class="range-group">
      <span class="range-label">Fläche</span>
      <input type="number" id="flaecheMin" placeholder="von m²" min="0">
      <span class="range-sep">–</span>
      <input type="number" id="flaecheMax" placeholder="bis m²" min="0">
    </div>
    <button type="button" id="resetFilters">Filter zurücksetzen</button>
  </section>
</div>
<p class="result-count" id="resultCount"></p>

<main id="cards"></main>
<button type="button" id="loadMore" class="load-more" hidden></button>
<p id="empty" class="empty" hidden>Keine Treffer gefunden.</p>

<script src="app.js"></script>
</body>
</html>
